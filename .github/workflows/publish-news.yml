# Near-realtime free publisher for @PolozNewss (no Cursor model).
# Repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
name: publish-news

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-news-poloz
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore dedupe state
        uses: actions/cache@v4
        with:
          path: data
          key: posted-kv-poloz-v1
          restore-keys: |
            posted-kv-poloz-

      - name: Publish newest news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MAX_POSTS_PER_CYCLE: "2"
        run: npm run publish:once
