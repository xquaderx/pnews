# Paced publisher for @PolozNewss (no Cursor model).
# Regular: up to 10/day, ≥90 min apart.
# Urgent (important mode): outside the regular cap, shorter gap, checked often.
# Repo secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
name: publish-news

on:
  schedule:
    # Every 30 min so urgent news is not stuck waiting for the next 2h slot.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-news-poloz
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Restore dedupe state
        uses: actions/cache@v4
        with:
          path: data
          key: posted-kv-poloz-${{ github.run_id }}
          restore-keys: |
            posted-kv-poloz-

      - name: Seed history from public channel
        run: npm run seed:history

      - name: Ensure pin + description
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npm run ensure:channel

      - name: Publish newest news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          MAX_POSTS_PER_CYCLE: "1"
          MAX_POSTS_PER_DAY: "10"
          MAX_URGENT_PER_DAY: "5"
          MIN_MINUTES_BETWEEN_POSTS: "90"
          MIN_MINUTES_BETWEEN_URGENT: "20"
        run: npm run publish:once
